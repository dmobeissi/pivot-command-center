<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIVOT Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=42">
</head><body>
<div id="loginwrap"></div>


<div class="app">
  <aside class="rail">
    <div class="brand"><span class="dot"></span><b>PIVOT</b></div>
    <nav class="nav" id="nav">
      <button data-view="digest">Digest</button>
      <button class="grp" data-view="tasksdash" data-group="tasks" aria-current="true">Tasks<span class="arw">⌄</span></button>
      <button class="sub" data-group="tasks" data-view="tasks">All Tasks</button>
      <button class="sub" data-group="tasks" data-view="recurring">Recurring Tasks</button>
      <button class="sub" data-group="tasks" data-view="mytasks">My Tasks</button>
      <button class="grp" data-view="moneydash" data-group="money">Money<span class="arw">⌄</span></button>
      <button class="sub" data-group="money" data-view="invoices">Invoices</button>
      <button class="sub" data-group="money" data-view="expenses">Expenses</button>
      <button class="sub" data-group="money" data-view="salaries">Salaries</button>
      <button class="sub" data-group="money" data-view="payouts">Payouts</button>
      <button class="sub" data-group="money" data-view="retainers">Retainers</button>
      <button data-view="accounts">Accounts</button>
      <button data-view="pipeline">Pipeline</button>
      <button data-view="projects">Projects</button>
      <button data-view="services">Services</button>
      <div class="navfoot">
        <button data-view="activity">Activity Log</button>
        <button data-view="setup">Settings</button>
      </div>
    </nav>
    <div class="navuser" id="navuser"></div>
  </aside>
  <div class="work">
    <div id="banner"></div>
    <header class="topbar">
      <h1 id="viewtitle">Dashboard</h1>
      <div class="filters">
        <span id="filterctrls" style="display:contents">
          <select id="fBrand"><option value="">All brands</option></select>
          <select id="fTeam"><option value="">All team</option></select>
          <select id="fStatus"><option value="">All status</option></select>
          <input type="search" id="fSearch" placeholder="Search">
        </span>
        <div class="addwrap"><button class="btn" id="addBtn">+ Add</button>
          <div class="addmenu" id="addMenu">
            <button data-add="task">Task</button>
            <button data-add="account">Account</button>
            <button data-add="invoice">Invoice</button>
            <button data-add="expense">Expense</button>
            <button data-add="salary">Salary</button>
            <button data-add="payout">Payout</button>
            <button data-add="recurring">Recurring task</button>
          </div>
        </div>
        <button class="theme" id="theme" title="Toggle theme">◐</button>
      </div>
    </header>
    <main class="main"><div id="view"><div class="center"><div class="spin"></div><div>Loading your workspace…</div></div></div></main>
  </div>
</div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js?v=42"></script>
</body></html>
