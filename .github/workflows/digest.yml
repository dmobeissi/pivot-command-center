name: PIVOT daily digest

# 07:00 Kuwait (04:00 UTC), Sunday–Thursday. Plus manual trigger.
on:
  schedule:
    - cron: "0 4 * * 0-4"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build digest card
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP_URL: https://dmobeissi.github.io/pivot-command-center/
        run: node scripts/digest.mjs

      - name: Post to Teams channel
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data @teams-payload.json "$TEAMS_WEBHOOK")
          echo "HTTP $code"; cat resp.txt
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
